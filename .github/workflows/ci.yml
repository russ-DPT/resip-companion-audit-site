name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Typecheck, unit tests, Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit scripts embedded in the engine are up to date
        run: npm run embed && git diff --exit-code src/lib/analysis/audit-scripts.generated.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  independent-reproduction:
    name: Independent reproduction in Python and R
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r validation/requirements.txt
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - name: Cross-check 40 simulated studies
        run: validation/cross-check.sh 40
      - uses: actions/upload-artifact@v4
        with:
          name: cross-check-results
          path: validation/cross-check-results.json
